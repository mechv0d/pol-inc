name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
  tag:
    types: [created]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & Type-Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Lint with ruff
        run: ruff check pol_inc/

      - name: Format check with ruff
        run: ruff format --check pol_inc/

      - name: Type-check with mypy
        run: mypy pol_inc/

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile pol_inc/bot/handlers.py
          python -m py_compile pol_inc/bot/formatting.py
          python -m py_compile pol_inc/application/sessions.py
          python -m py_compile pol_inc/application/packs.py
          python -m py_compile pol_inc/domain/session.py
          python -m py_compile pol_inc/domain/packs.py
          python -m py_compile pol_inc/config.py

      - name: Import check
        run: |
          python -c "from pol_inc.bot.handlers import router"
          python -c "from pol_inc.bot.formatting import format_turn, format_resolution"
          python -c "from pol_inc.application.sessions import SessionManager"
          python -c "from pol_inc.domain.session import Session, Party"

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Render
        run: |
          curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"forceUpdate": true}'
